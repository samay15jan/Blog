      timeline: May 2023
      status: Archived
      desc: A free web application that allows users to store and share files permanently using Google Drive as backend storage, with shortened URLs for easy sharing.
      links:
        - label: GitHub
          url: https://github.com/samay15jan/Storage-Box
        - label: Demo
